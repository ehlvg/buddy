[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-recorder"
version = "1.0.0"
description = "Hold SPACE to record, release to save. Repeat."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "sounddevice",
    "soundfile",
    "numpy",
    "pynput",
]

[project.scripts]
buddy = "buddy.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["buddy*"]
